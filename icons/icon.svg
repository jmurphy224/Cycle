<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1b2130"/>
      <stop offset="1" stop-color="#0b0e12"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3f4593"/>
      <stop offset="1" stop-color="#8f96ff"/>
    </linearGradient>
  </defs>
  <!-- full-bleed square: iOS and Android apply their own rounded mask -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- faint circuit grid -->
  <g stroke="#7c83ff" stroke-opacity="0.07" stroke-width="3" fill="none">
    <path d="M0 256H1024M0 512H1024M0 768H1024M256 0V1024M512 0V1024M768 0V1024"/>
  </g>
  <!-- the cycle dial from the Today screen -->
  <circle cx="512" cy="512" r="352" fill="none" stroke="#1e242e" stroke-width="54"/>
  <circle cx="512" cy="512" r="352" fill="none" stroke="url(#arc)" stroke-width="54"
    stroke-linecap="round" stroke-dasharray="1659 553" transform="rotate(-90 512 512)"/>
  <!-- M traced like a circuit path, legs ending in solder pads -->
  <path d="M340 636V372L512 552L684 372V636" fill="none" stroke="#e8ecf1" stroke-width="64"
    stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/>
  <circle cx="340" cy="680" r="38" fill="#0d1014" stroke="#4ade80" stroke-width="20"/>
  <circle cx="684" cy="680" r="38" fill="#0d1014" stroke="#4ade80" stroke-width="20"/>
</svg>
